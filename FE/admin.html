<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/css/styleadmin.css">
</head>

<body>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2>Admin Panel</h2>
        <button id="sidebarToggle" class="btn btn-secondary" aria-label="Toggle sidebar">☰</button>
      </div>
      <div class="user-badge" id="sidebarUser">
        <!-- user info injected by admin.js -->
      </div>
      <nav>
        <ul>
          <li><a href="#" id="linkDashboard"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="8" height="8" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                  <rect x="13" y="3" width="8" height="8" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                  <rect x="3" y="13" width="8" height="8" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                  <rect x="13" y="13" width="8" height="8" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                </svg>
              </span><span class="nav-text">Dashboard</span></a></li>
          <li><a href="#" id="linkUsers"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="3" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                  <path d="M4 20c0-3.314 2.686-6 6-6h4c3.314 0 6 2.686 6 6" stroke="#0b3a66" stroke-width="1.2"
                    fill="none" />
                </svg>
              </span><span class="nav-text">Users</span></a></li>
          <li><a href="#" id="linkCustomers"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="3" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                  <path d="M4 20c0-3.314 2.686-6 6-6h4c3.314 0 6 2.686 6 6" stroke="#0b3a66" stroke-width="1.2"
                    fill="none" />
                </svg>
              </span><span class="nav-text">Customers</span></a></li>
          <li><a href="#" id="linkProducts"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="18" height="18" rx="2" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                </svg>
              </span><span class="nav-text">Products</span></a></li>
          <li><a href="#" id="linkProductTypes"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="18" height="18" rx="2" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                </svg>
              </span><span class="nav-text">Product Types</span></a></li>
          <li><a href="#" id="linkBrands"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="18" height="18" rx="2" stroke="#0b3a66" stroke-width="1.2" fill="#f7f8fa" />
                </svg>
              </span><span class="nav-text">Brands</span></a></li>
          <li><a href="#" id="linkOrders"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="#0b3a66" stroke-width="1.2"
                    fill="none" />
                </svg>
              </span><span class="nav-text">Orders</span></a></li>
          <li><a href="#" id="linkInventory"><span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke="#0b3a66"
                    stroke-width="1.2" fill="none" />
                </svg>
              </span><span class="nav-text">Inventory</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <section id="adminContent" class="content-area">
        <!-- fragments will be loaded here -->
      </section>
    </main>
  </div>

  <script src="/jsadmin/user.js"></script>
  <script src="/jsadmin/customer.js"></script>
  <script src="/jsadmin/product.js"></script>
  <script src="/jsadmin/producttype.js"></script>
  <script src="/jsadmin/order.js"></script>
  <script src="/jsadmin/brand.js"></script>
  <script src="/jsadmin/inventory.js"></script>
  <script src="/jsadmin/dashboard.js"></script>
  <script src="/jsadmin/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => adminApp.init());</script>
</body>

</html>
