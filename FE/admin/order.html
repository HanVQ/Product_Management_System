<div class="container" id="order-page">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>Orders</h3>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openOrderModal()">Create Order</button>
            </div>
        </div>

        <div class="controls">
            <div style="display: flex; align-items: center; gap: 10px;">
                <label>Show</label>
                <select class="entries-select" id="entriesPerPage">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
                <label>entries</label>
            </div>
            <div class="search-box">
                <label>Search:</label>
                <input type="text" id="searchInput" placeholder="Search by customer or status">
            </div>
        </div>

        <div id="results"></div>

        <div class="pagination" id="pagination"></div>
        <div class="info-text" id="infoText"></div>
    </div>
</div>

<!-- Add/Edit Order Modal -->
<div class="modal" id="orderModal">
    <div class="modal-content large">
        <div class="modal-header">
            <h2 id="modalTitle">Create Order</h2>
        </div>
        <div id="modalError" class="error" style="display:none;"></div>
        <form onsubmit="saveOrder(event)">
            <div class="form-group">
                <label>Customer:</label>
                <select id="orderCustomer" required>
                    <option value="">Select Customer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Items:</label>
                <div id="orderItems">
                    <div class="order-item">
                        <select class="item-product" required onchange="onProductSelected(this)">
                            <option value="">Select Product</option>
                        </select>
                        <select class="item-variant" required onchange="calculateTotal()" style="display:none;">
                            <option value="">Select Variant</option>
                        </select>
                        <input type="number" class="item-quantity" min="1" placeholder="Qty" required>
                        <button type="button" class="btn btn-small" onclick="removeItem(this)">Remove</button>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" onclick="addItem()">Add Item</button>
            </div>
            <div class="form-group">
                <label>Total Amount: $<span id="totalAmount">0.00</span></label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeOrderModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Order</button>
            </div>
        </form>
    </div>
</div>

<!-- Order Details Modal -->
<div class="modal" id="orderDetailsModal">
    <div class="modal-content large">
        <div class="modal-header">
            <h2>Order Details</h2>
        </div>
        <div id="orderDetailsContent"></div>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeOrderDetailsModal()">Close</button>
        </div>
    </div>
</div>
