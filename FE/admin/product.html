<div class="container" id="product-page">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>Products</h3>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openProductModal()">Add Product</button>
            </div>
        </div>

        <div class="controls">
            <div style="display: flex; align-items: center; gap: 10px;">
                <label>Show</label>
                <select class="entries-select" id="entriesPerPage">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
                <label>entries</label>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
                <div class="search-box">
                    <label>Search:</label>
                    <input type="text" id="searchInput" placeholder="Search by name or brand">
                </div>
                <div>
                    <button id="filterToggleBtn" class="btn btn-secondary">Filter ▾</button>
                    <button id="sortToggleBtn" class="btn btn-secondary">Sort ▾</button>
                </div>
            </div>
            <!-- Filter panel (hidden by default) -->
            <div id="filterPanel" style="display:none;margin-top:8px;padding:8px;border:1px solid #eee;background:#fff;border-radius:4px;">
                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
                    <div>
                    <label>Product Type</label>
                        <select id="filterProductType">
                            <option value="">All</option>
                        </select>
                    </div>
                    <div>
                        <label>Brand</label>
                        <select id="filterBrand">
                            <option value="">All</option>
                        </select>
                    </div>
                    <div>
                        <label>Stock Status</label>
                        <select id="filterStockStatus">
                            <option value="">All</option>
                            <option value="in stock">In stock</option>
                            <option value="low stock">Low stock</option>
                            <option value="out of stock">Out of stock</option>
                        </select>
                    </div>
                    <div style="display:flex;gap:8px;align-items:flex-end;margin-left:8px">
                        <button id="applyFiltersBtn" class="btn btn-primary">Apply</button>
                        <button id="clearFiltersBtn" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
            </div>
            <!-- Sort panel (hidden by default) -->
            <div id="sortPanel" style="display:none;margin-top:8px;padding:8px;border:1px solid #eee;background:#fff;border-radius:4px;">
                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
                    <div>
                        <label>Sort</label>
                        <select id="sortOption">
                            <option value="name:asc">Name (A–Z)</option>
                            <option value="name:desc">Name (Z–A)</option>
                            <option value="price:asc">Price (Low → High)</option>
                            <option value="price:desc">Price (High → Low)</option>
                            <option value="brand:asc">Brand (A–Z)</option>
                            <option value="brand:desc">Brand (Z–A)</option>
                            <option value="stock:asc">Stock (Low → High)</option>
                            <option value="stock:desc">Stock (High → Low)</option>
                        </select>
                    </div>
                    
                    <div style="display:flex;gap:8px;align-items:flex-end;margin-left:8px">
                        <button id="applySortBtn" class="btn btn-primary">Apply</button>
                        <button id="clearSortBtn" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="results"></div>

        <div class="pagination" id="pagination"></div>
        <div class="info-text" id="infoText"></div>
    </div>
</div>

<!-- Add/Edit Product Modal -->
<div class="modal" id="productModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add Product</h2>
        </div>
        <div id="modalError" class="error" style="display:none;"></div>
        <form onsubmit="saveProduct(event)">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="productName" required>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea id="productDescription"></textarea>
            </div>
            <div class="form-group">
                <label>Price:</label>
                <input type="number" id="productPrice" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label>Stock:</label>
                <input type="number" id="productStock" min="0" required>
                <span id="productStockStatus" class="badge" style="margin-left:8px;"></span>
            </div>
            <div class="form-group">
                <label>Product Type:</label>
                <select id="productCategory" required>
                    <!-- Options populated dynamically -->
                </select>
            </div>
            <div class="form-group">
                <label>Brand:</label>
                <select id="productBrand" required>
                    <!-- Options populated dynamically -->
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeProductModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
