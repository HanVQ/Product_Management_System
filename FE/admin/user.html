<div class="container" id="user-page">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3>Users</h3>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openAddModal()">Add User</button>
      </div>
    </div>

    <div class="controls">
    <div style="display: flex; align-items: center; gap: 10px;">
      <label>Show</label>
      <select class="entries-select" id="entriesPerPage">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <label>entries</label>
    </div>
    <div class="search-box">
      <label>Search:</label>
      <input type="text" id="searchInput" placeholder="Search by name or email">
    </div>
  </div>

    <div id="results"></div>

    <div class="pagination" id="pagination"></div>
    <div class="info-text" id="infoText"></div>
  </div>
</div>

<!-- Add/Edit User Modal -->
<div class="modal" id="userModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Add User</h2>
    </div>
    <div id="modalError" class="error" style="display:none;"></div>
    <form onsubmit="saveUser(event)">
      <div class="form-group">
        <label>Name:</label>
        <input type="text" id="userName" required>
      </div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="userEmail" required>
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="userPassword">
      </div>
      <div class="form-group">
        <label>Role:</label>
        <select id="userRole" required>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
