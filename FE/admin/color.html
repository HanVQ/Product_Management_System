<div class="container" id="color-page">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>Colors</h3>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openColorModal()">Add Color</button>
            </div>
        </div>

        <div id="colorResults"></div>
    </div>
</div>

<!-- Add/Edit Color Modal -->
<div class="modal" id="colorModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="colorModalTitle">Add Color</h2>
        </div>
        <div id="colorModalError" class="error" style="display:none;"></div>
        <form onsubmit="saveColor(event)">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="colorName" required>
            </div>
            <div class="form-group">
                <label>Hex Color:</label>
                <div style="display:flex;gap:10px;align-items:center;">
                    <input type="color" id="colorHex" required style="width:60px;height:40px;border:1px solid #ddd;cursor:pointer;">
                    <input type="text" id="colorHexText" placeholder="#000000" required style="flex:1;" pattern="^#([0-9A-F]{6}|[0-9A-F]{3})$|^#([0-9a-f]{6}|[0-9a-f]{3})$" title="Valid hex colors: #RGB or #RRGGBB">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeColorModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
