<div class="container" id="producttype-page">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>Brands</h3>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openBrandModal()">Add Brand</button>
            </div>
        </div>

        <div class="controls">
            <div style="display: flex; align-items: center; gap: 10px;">
                <label>Show</label>
                <select class="entries-select" id="entriesPerPage">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
                <label>entries</label>
            </div>
            <div class="search-box">
                <label>Search:</label>
                <input type="text" id="searchInput" placeholder="Search by name">
            </div>
        </div>

        <div id="results"></div>

        <div class="pagination" id="pagination"></div>
        <div class="info-text" id="infoText"></div>
    </div>
</div>

<!-- Add/Edit Brand Modal -->
<div class="modal" id="brandModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add Brand</h2>
        </div>
        <div id="modalError" class="error" style="display:none;"></div>
        <form onsubmit="saveBrand(event)">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="brandName" required>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea id="brandDescription"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeBrandModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
