<div class="container" id="customer-page">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>Customers</h3>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openCustomerModal()">Add Customer</button>
            </div>
        </div>

        <div class="controls">
            <div style="display: flex; align-items: center; gap: 10px;">
                <label>Show</label>
                <select class="entries-select" id="entriesPerPage">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
                <label>entries</label>
            </div>
            <div class="search-box">
                <label>Search:</label>
                <input type="text" id="searchInput" placeholder="Search by name or email">
            </div>
        </div>

        <div id="results"></div>

        <div class="pagination" id="pagination"></div>
        <div class="info-text" id="infoText"></div>
    </div>
</div>

<!-- Add/Edit Customer Modal -->
<div class="modal" id="customerModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add Customer</h2>
        </div>
        <div id="modalError" class="error" style="display:none;"></div>
        <form onsubmit="saveCustomer(event)">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="customerName" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="customerEmail" required>
            </div>
            <div class="form-group">
                <label>Phone:</label>
                <input type="text" id="customerPhone">
            </div>
            <div class="form-group">
                <label>Address:</label>
                <textarea id="customerAddress"></textarea>
            </div>
            <div class="form-group">
                <label>Status:</label>
                <select id="customerStatus" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeCustomerModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
