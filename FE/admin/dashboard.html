<div class="container" id="dashboard-page">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>Dashboard</h3>
        </div>

        <!-- Quick Stats -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:20px;">
            <div class="card1" style="padding:20px;text-align:center;">
                <h4>Users</h4>
                <p id="statUsers" style="font-size:24px;font-weight:bold;">0</p>
            </div>
            <div class="card1" style="padding:20px;text-align:center;">
                <h4>Customers</h4>
                <p id="statCustomers" style="font-size:24px;font-weight:bold;">0</p>
            </div>
            <div class="card1" style="padding:20px;text-align:center;">
                <h4>Products</h4>
                <p id="statProducts" style="font-size:24px;font-weight:bold;">0</p>
            </div>
            <div class="card1" style="padding:20px;text-align:center;">
                <h4>Brands</h4>
                <p id="statBrands" style="font-size:24px;font-weight:bold;">0</p>
            </div>
            <div class="card1" style="padding:20px;text-align:center;">
                <h4>Products Type</h4>
                <p id="statProductsType" style="font-size:24px;font-weight:bold;">0</p>
            </div>
            <div class="card1" style="padding:20px;text-align:center;">
                <h4>Orders</h4>
                <p id="statOrders" style="font-size:24px;font-weight:bold;">0</p>
            </div>
            <div class="card1" style="padding:20px;text-align:center;">
                <h4>Inventory Transactions</h4>
                <p id="statInventory" style="font-size:24px;font-weight:bold;">0</p>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="card" style="margin-top:20px;">
            <h4>Recent Activity</h4>
            <ul id="recentActivity" style="list-style:none;padding:0;margin:0;">
                <li>No recent activity</li>
            </ul>
        </div>
    </div>
</div>
